name: Bug report
description: Something in the Share Chat plugin doesn't work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For security issues, use private vulnerability
        reporting instead (see SECURITY.md) — do not file them here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: Clicked the share button while ... expected ... but ...
    validations:
      required: true
  - type: input
    id: a0-version
    attributes:
      label: Agent Zero version
      placeholder: e.g. v0.9.x / fork build tag
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Browser context
      options:
        - HTTPS (secure context)
        - HTTP / insecure context (clipboard fallback path)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console output
      render: text
