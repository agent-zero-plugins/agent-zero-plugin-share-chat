<html>
<head>
  <title>Share Chat — copy deep link</title>
</head>
<body>
  <div x-data="{
    copied: false,

    async shareChat() {
      const ctxid = globalThis.getContext?.();
      if (!ctxid) return;

      const url = new URL(window.location.href);
      // Clean existing params and set only ctxid
      url.search = '';
      url.searchParams.set('ctxid', ctxid);
      const link = url.toString();

      try {
        await navigator.clipboard.writeText(link);
        this.copied = true;
        setTimeout(() => { this.copied = false; }, 2000);
      } catch (e) {
        // Fallback for non-HTTPS contexts
        const ta = document.createElement('textarea');
        ta.value = link;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        this.copied = true;
        setTimeout(() => { this.copied = false; }, 2000);
      }
    }
  }">
    <div class="share-chat-btn"
         :class="{ 'share-copied': copied }"
         @click="shareChat()"
         :title="copied ? 'Link copied!' : 'Copy link to this chat'">
      <div class="share-chat-icon">
        <span class="material-symbols-outlined"
              x-text="copied ? 'check' : 'share'"
              :style="copied ? 'color: #4caf50' : ''"></span>
      </div>
    </div>
  </div>

  <style>
    .share-chat-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .share-chat-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08),
                  0 4px 12px rgba(0, 0, 0, 0.18);
    }

    .share-chat-btn.share-copied {
      border-color: rgba(76, 175, 80, 0.4);
      background: rgba(76, 175, 80, 0.1);
    }

    .share-chat-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      width: 100%;
      height: 100%;
    }

    .share-chat-icon .material-symbols-outlined {
      font-size: 18px;
      opacity: 0.7;
      transition: all 0.2s ease;
    }

    .share-chat-btn:hover .share-chat-icon .material-symbols-outlined {
      opacity: 1;
    }
  </style>
</body>
</html>
