[project]
name = "agent-zero-plugin-share-chat"
version = "0.1.0"
description = "Adds a share button to copy a deep link to the current chat."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/_testkit/src"]
norecursedirs = ["tests/_testkit", "dist", "build"]
asyncio_mode = "auto"
markers = [
    "unit: fast L0 tests, no subprocess, no network",
    "component: L1 tests, A0 in-process or fixtures",
    "integration: L2 tests, real services",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
